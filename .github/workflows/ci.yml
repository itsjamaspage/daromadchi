name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Cancel superseded runs on feature branches / PRs so a fast follow-up push
# frees the runner instead of queueing behind a now-stale run (runner
# starvation was cancelling jobs after a 15-minute queue). main is exempt:
# its runs drive deploy + health-check + notify and must never be cancelled
# mid-flight by a later push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # NOT listed in branch protection yet — deliberately. It runs on every push
    # and PR so the result is visible, but it cannot block a merge until someone
    # adds "Tests" to the required checks. Promote it once you trust it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daro
          POSTGRES_PASSWORD: daro
          POSTGRES_DB: daro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # A dummy token, never a real one. lib/telegram.ts reads TELEGRAM_BOT_TOKEN
      # at module load and returns false without it, so the suites that assert
      # "…and tells them on Telegram" never reach their own fetch mock and fail
      # for a reason that has nothing to do with the code under test.
      TELEGRAM_BOT_TOKEN: ci-dummy-token
      TELEGRAM_BOT_USERNAME: ci_dummy_bot
      ADMIN_EMAIL: founder@drm.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # Two databases, because one suite cannot share.
      #
      # admin-analytics asserts GLOBAL totals across the payments table — that is
      # what the page it covers actually computes — so any other suite inserting
      # a paid payment inflates its expected figure. It is not order-dependence
      # to be fixed in the query; the query is right. It just needs its own DB.
      - name: Prepare databases
        run: |
          export PGPASSWORD=daro
          psql -h localhost -U daro -d postgres -c 'CREATE DATABASE daro_admin;'
          for DB in daro_test daro_admin; do
            DATABASE_URL="postgres://daro:daro@localhost:5432/$DB" npx drizzle-kit push --force
            DATABASE_URL="postgres://daro:daro@localhost:5432/$DB" node scripts/apply-sql-migrations.mjs
          done

      # Every test:* script except the two handled separately. Reading them out
      # of package.json rather than listing them here means a newly added suite
      # is picked up automatically instead of being silently skipped — which is
      # how 45 scripts came to exist with none of them running.
      - name: Test suites
        run: |
          FAILED=""
          for T in $(node -e "const s=require('./package.json').scripts;console.log(Object.keys(s).filter(k=>k.startsWith('test:')&&k!=='test:admin').join(' '))"); do
            echo "::group::$T"
            if npm run --silent "$T"; then echo "PASS $T"; else echo "FAIL $T"; FAILED="$FAILED $T"; fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then echo "Failed:$FAILED"; exit 1; fi
        env:
          DATABASE_URL: postgres://daro:daro@localhost:5432/daro_test

      - name: Admin analytics (isolated database)
        run: npm run --silent test:admin
        env:
          DATABASE_URL: postgres://daro:daro@localhost:5432/daro_admin


  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Poll production /api/health
        # The VPS deploy takes 60–180s (git pull, npm ci, next build,
        # pm2 restart). Nginx returns 502 for a few seconds during
        # the pm2 restart window. Poll with retries instead of one
        # shot after a fixed sleep so a healthy deploy that finished
        # inside the window still passes.
        run: |
          MAX_ATTEMPTS=30            # 30 × 10s = 5 min total budget
          SLEEP_SECONDS=10
          INITIAL_DELAY=30           # give the deploy job time to at least start
          echo "Waiting ${INITIAL_DELAY}s for deploy to begin..."
          sleep $INITIAL_DELAY
          for i in $(seq 1 $MAX_ATTEMPTS); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://www.daromadchi.uz/api/health || echo "000")
            echo "Attempt $i/$MAX_ATTEMPTS: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep $SLEEP_SECONDS
          done
          echo "Health check failed: no 200 response after $MAX_ATTEMPTS attempts."
          exit 1

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build, health-check]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Notify success
        if: needs.build.result == 'success' && needs.health-check.result == 'success'
        continue-on-error: true
        run: |
          MSG="✅ Deploy succeeded%0A${{ github.event.head_commit.message }}%0A${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          curl -sf "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}" || echo "Telegram notify skipped"
      - name: Notify failure
        if: needs.build.result != 'success' || needs.health-check.result != 'success'
        continue-on-error: true
        run: |
          MSG="❌ CI FAILED%0A${{ github.event.head_commit.message }}%0ALogs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=${MSG}" || echo "Telegram notify skipped"
