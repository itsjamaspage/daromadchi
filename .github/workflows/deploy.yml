name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys. Without this, two merges to main close together spin up two
# deploy runs that both `git reset --hard` + `npm ci` + `next build` in the SAME
# /var/www/daromadchi tree — one yanks the working tree out from under the other's
# build, which SIGTERMs it (exit 143). cancel-in-progress: false queues the newer
# run until the current one finishes, so deploys never overlap and each completes.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'DEPLOY'
          set -e
          cd /var/www/daromadchi
          echo "Resetting working tree to latest main..."
          git merge --abort 2>/dev/null || true
          git rebase --abort 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          echo "Installing dependencies..."
          # `git reset --hard` leaves node_modules alone (gitignored), so a
          # partially-installed tree from a killed npm run can persist between
          # deploys. When that happens npm ci trips on ENOTEMPTY trying to
          # rmdir dirs whose contents are half-there. Fall back through
          # increasingly aggressive cleanup so the deploy recovers on its own
          # instead of needing us to SSH in and rm -rf node_modules.
          npm ci --no-audit --no-fund \
            || (echo "npm ci failed, wiping node_modules and retrying..." && rm -rf node_modules && npm ci --no-audit --no-fund) \
            || (echo "npm ci still failing, falling back to npm install..." && rm -rf node_modules && npm install --no-audit --no-fund)
          echo "Building..."
          # Clear the previous Turbopack build output before rebuilding. `.next`
          # is gitignored so `git reset --hard` never touches it, and a stale
          # cache from an earlier build can leave the production compile
          # referencing an externalized module copy (e.g. .next/node_modules/
          # pg-<hash>/esm/index.mjs) that this build never regenerates — the
          # compile "succeeds" but page-data collection then dies with
          # ERR_MODULE_NOT_FOUND, aborting the deploy before migrations run. A
          # full rebuild each deploy is cheap (~40s) and immune to that. Mirrors
          # the node_modules self-heal above.
          rm -rf .next
          npm run build
          # Exported so both the migration step and the restarted process see it.
          export TZ=Asia/Tashkent
          echo "Applying DB migrations..."
          node scripts/apply-sql-migrations.mjs
          echo "Restarting app..."
          # TZ=Asia/Tashkent is a SAFETY NET, not the mechanism. Business dates go
          # through lib/shop-time.ts, which names the zone explicitly and so does
          # not care what the process TZ is — that is what makes the same answer
          # come out in a New York browser, a UTC server and a Tashkent shop.
          # Setting it here means any remaining ambient `new Date()` formatting
          # (a log line, a fallback) also reads as the seller's clock rather than
          # UTC. `--update-env` is required: pm2 keeps the old environment across
          # a plain restart, so without it this would take effect only on a
          # process the box happened to recreate.
          pm2 restart daromadchi --update-env

          # ── Post-deploy smoke check: ABORT if the build we just started is not
          # actually serving. ───────────────────────────────────────────────────
          #
          # `pm2 restart` returns 0 when pm2 ACCEPTS the command, not when the app
          # answers a request, and this script had nothing after it. On 27 Aug the
          # deploy for #392 reported success at 14:23 while production was dead:
          # .next referenced a Next internal missing from node_modules,
          # instrumentation.js failed to load, and pm2 still reported "online".
          # Nobody knew for 40 minutes.
          #
          # Two probes, because one is not enough:
          #   /api/health  — must return the SHA WE JUST DEPLOYED. A 200 alone
          #     proves nothing; an old process serving an old build also returns
          #     200, which is the hole BUILD_SHA was added to close and which the
          #     ci.yml health poll still leaves open by checking only the status.
          #   /            — must render. The health route touches no filesystem
          #     by design, so it can answer from a process whose .next is gutted.
          #     Rendering a real page exercises the chunk loading that actually
          #     broke.
          #
          # ABORT-ONLY: a failure fails the deploy and leaves the PREVIOUS build
          # running, which is the safe state. No rollback is attempted.
          echo "Verifying the running build..."
          TARGET_SHA=$(git rev-parse HEAD)
          SMOKE_PORT=$(grep -hm1 '^PORT=' .env.production.local .env.local .env .env.production 2>/dev/null | cut -d= -f2- | tr -d "\"'")
          SMOKE_PORT=${SMOKE_PORT:-3000}
          RUNNING=""
          for i in $(seq 1 30); do
            BODY=$(curl -s -m 5 "http://127.0.0.1:$SMOKE_PORT/api/health" 2>/dev/null || true)
            RUNNING=$(printf %s "$BODY" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p')
            [ "$RUNNING" = "$TARGET_SHA" ] && break
            sleep 3
          done
          if [ "$RUNNING" != "$TARGET_SHA" ]; then
            echo "SMOKE FAIL: /api/health reports commit '${RUNNING:-<unreachable>}', deployed $TARGET_SHA"
            echo "The previous build is still running. Investigate before retrying."
            exit 1
          fi
          HOME_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "http://127.0.0.1:$SMOKE_PORT/" 2>/dev/null || echo "000")
          if [ "$HOME_CODE" != "200" ]; then
            echo "SMOKE FAIL: the app answers /api/health but cannot render / (HTTP $HOME_CODE)."
            echo "That is the signature of a broken .next served by a live process."
            exit 1
          fi
          echo "Smoke check passed: serving $TARGET_SHA, / renders."
          echo "Installing cron runner..."
          # Install the TRACKED script. It has existed at scripts/cron-runner.sh
          # since #249 ("put cron scheduling in version control") — and this
          # deploy step has been overwriting it on every run with an inline
          # heredoc copy, so the reviewed, version-controlled script was dead code
          # and the box ran an inferior duplicate nobody could see in a diff.
          #
          # The duplicate is why the 27 Aug outage was silent. It used `curl -sf`,
          # which exits non-zero with NO output on an HTTP error, and logged every
          # job to one file. The tracked script uses `curl -sS`, captures the
          # response body (so a 200-with-an-error-payload is visible), writes a
          # per-job logfile with rc/http/elapsed, and exits non-zero loudly.
          install -m 755 scripts/cron-runner.sh /var/www/daromadchi/cron-runner.sh
          if ! grep -q '^CRON_SECRET=' .env .env.local .env.production .env.production.local 2>/dev/null; then
            echo "WARNING: CRON_SECRET is not set in the server .env — scheduled sync will be rejected with 403 until it is added."
          fi
          # ENCRYPTION_KEY protects every stored marketplace API token and ATMOS
          # card token. lib/crypto.ts now REFUSES to write a credential in
          # production without it rather than silently storing plain text, so an
          # absent or malformed key turns "connect a shop" into a visible error.
          # This says so at deploy time, before a seller finds out instead.
          ENC_LINE=$(grep -hm1 '^ENCRYPTION_KEY=' .env .env.local .env.production .env.production.local 2>/dev/null | cut -d= -f2- | tr -d "\"'")
          if [ -z "$ENC_LINE" ]; then
            echo "WARNING: ENCRYPTION_KEY is not set in the server .env — connecting a shop will now FAIL rather than store the token in plain text. Generate one with: openssl rand -base64 32"
          elif [ "$(printf %s "$ENC_LINE" | base64 -d 2>/dev/null | wc -c)" != "32" ]; then
            echo "WARNING: ENCRYPTION_KEY is set but does not decode to 32 bytes — credential writes will fail. Generate one with: openssl rand -base64 32"
          fi
          ( crontab -l 2>/dev/null | grep -v 'daromadchi/cron-runner.sh' || true
            echo '*/5 * * * * /var/www/daromadchi/cron-runner.sh sync >> $HOME/daromadchi-cron.log 2>&1'
            echo '*/5 * * * * /var/www/daromadchi/cron-runner.sh stock-sync >> $HOME/daromadchi-cron.log 2>&1'
            echo '5 * * * * /var/www/daromadchi/cron-runner.sh telegram-digest >> $HOME/daromadchi-cron.log 2>&1'
            # Daily: downgrade lapsed paid plans to free.
            echo '15 3 * * * /var/www/daromadchi/cron-runner.sh expire-plans >> $HOME/daromadchi-cron.log 2>&1'
            # Hourly: auto-renew subscriptions (no-op until BILLING_AUTORENEW_ENABLED=1).
            echo '20 * * * * /var/www/daromadchi/cron-runner.sh billing-renew >> $HOME/daromadchi-cron.log 2>&1'
            # The work-liveness watchdog (#395). Its OWN line, deliberately NOT via
            # cron-runner.sh: cron-runner speaks HTTP to the app, so it is dead in
            # exactly the situation the alarm exists for. This reads the database
            # directly and needs only pg + node, so it still fires when the build
            # is broken — which is what happened on 27 Aug.
            #
            # It was added to scripts/crontab.example and never to this list, and
            # this list is what actually gets installed. So it has never run.
            echo '*/5 * * * * /var/www/daromadchi/scripts/sync-freshness-check.sh >> $HOME/daromadchi-cron.log 2>&1' ) | crontab -
          echo "Deploy complete."
          DEPLOY
