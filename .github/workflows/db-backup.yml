name: DB · Backup Postgres

# Nightly + on-demand backup of whatever DATABASE_URL points to on the
# VPS. Runs pg_dump on the VPS itself (Postgres is bound to 127.0.0.1)
# and keeps 14 rotated dumps at /var/backups/daromadchi/.
#
# Backups stay ON OUR OWN INFRASTRUCTURE (the Hetzner VPS) only. The dump
# is NOT copied off the VPS or uploaded to GitHub — the full DB (emails,
# password hashes, payments, Telegram IDs, encrypted marketplace tokens)
# must never leave our infrastructure, so GitHub is not a data processor.
#
# Trigger MANUALLY from the Actions tab any time you want an on-demand
# dump. Otherwise runs itself nightly at 03:00 UTC — recovery point
# is at most ~24h stale.
#
# --schema=public --no-owner --no-acl -Fc: dump can be restored into
# any plain Postgres of the same or newer major version with a single
# `pg_restore -d …` call. See docs/RESTORE.md (if present) or ping the
# runbook in the commit that added this workflow.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC nightly

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run pg_dump on VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' <<'REMOTE'
          set -euo pipefail

          # Ensure pg_dump is available on the VPS. postgresql-client-common
          # + postgresql-client are ~10MB; safe to apt-install on first run.
          if ! command -v pg_dump >/dev/null 2>&1; then
            echo "Installing postgresql-client..."
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          fi

          # Find the app's .env file and pull DATABASE_URL out of it.
          # Same file-priority order as deploy.yml.
          cd /var/www/daromadchi
          DB_URL=""
          for f in .env.production.local .env.local .env .env.production; do
            [ -f "$f" ] || continue
            v=$(grep -m1 '^DATABASE_URL=' "$f" | cut -d= -f2- | sed "s/^[\"']//;s/[\"']$//")
            if [ -n "$v" ]; then DB_URL="$v"; break; fi
          done
          if [ -z "$DB_URL" ]; then
            echo "ERROR: DATABASE_URL not found in any .env file under /var/www/daromadchi"
            exit 1
          fi

          # Print the host only (never the password) so the workflow log
          # confirms which DB we backed up without leaking the credential.
          HOST=$(echo "$DB_URL" | sed -E 's#.*@([^:/]+).*#\1#')
          echo "Dumping public schema from host: $HOST"

          sudo mkdir -p /var/backups/daromadchi
          sudo chown -R "$(whoami)":"$(whoami)" /var/backups/daromadchi
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          OUT=/var/backups/daromadchi/dump-${STAMP}.dump

          # --schema=public: only the app's data; skip system schemas.
          # -Fc: custom format, best for pg_restore, ~5x smaller than plain SQL.
          # --no-owner --no-acl: skip role/ACL metadata so the dump is
          #   portable between Postgres instances with different roles.
          pg_dump "$DB_URL" \
            --schema=public \
            --no-owner --no-acl \
            -Fc \
            -f "$OUT"

          echo "Wrote $OUT ($(du -h "$OUT" | cut -f1))"

          # Keep the 14 newest dumps, delete the rest.
          ls -1t /var/backups/daromadchi/dump-*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
          echo "Retention: kept newest 14 dumps."
          echo "Backup complete — dump stored on the VPS only, not copied off-host."
          REMOTE
